name: Stündlicher Lehrstellencheck

on:
  schedule:
    - cron: '0 6-17 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scraper triggern
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X GET \
            "${{ secrets.APP_URL }}/api/cron/scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 180)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "Server error – check Vercel logs"
            exit 1
          fi
